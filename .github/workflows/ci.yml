name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      matrix:
        # The supported floor (AGENTS.md, SPEC.md Implementation) and current.
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make test

  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: test=${{ needs.test.result }}
